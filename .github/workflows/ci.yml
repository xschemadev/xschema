name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  # Detect which paths changed
  changes:
    runs-on: ubuntu-latest
    outputs:
      cli: ${{ steps.filter.outputs.cli }}
      typescript: ${{ steps.filter.outputs.typescript }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            cli:
              - 'cli/**'
            typescript:
              - 'typescript/**'

  commitlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Validate commits
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            bunx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose
          else
            bunx commitlint --from HEAD~1 --to HEAD --verbose
          fi

  go-test:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.cli == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Run tests
        run: go test ./... -v
        working-directory: cli

      - name: Run vet
        run: go vet ./...
        working-directory: cli

  ts-build:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.typescript == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install
        working-directory: typescript

      - name: Build all packages
        run: bun run build
        working-directory: typescript

      - name: Type check all packages
        run: bun run typecheck
        working-directory: typescript

  # Passthrough jobs for branch protection
  go-test-result:
    runs-on: ubuntu-latest
    needs: [changes, go-test]
    if: always()
    steps:
      - run: |
          if [ "${{ needs.go-test.result }}" = "failure" ]; then
            echo "go-test failed"
            exit 1
          fi
          echo "go-test passed or was skipped"

  ts-build-result:
    runs-on: ubuntu-latest
    needs: [changes, ts-build]
    if: always()
    steps:
      - run: |
          if [ "${{ needs.ts-build.result }}" = "failure" ]; then
            echo "ts-build failed"
            exit 1
          fi
          echo "ts-build passed or was skipped"
