name: Release Please

on:
  push:
    branches:
      - master

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      cli--release_created: ${{ steps.release.outputs['cli--release_created'] }}
      cli--tag_name: ${{ steps.release.outputs['cli--tag_name'] }}
      core--release_created: ${{ steps.release.outputs['core--release_created'] }}
      client--release_created: ${{ steps.release.outputs['client--release_created'] }}
      zod--release_created: ${{ steps.release.outputs['zod--release_created'] }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Build and publish Go CLI when released
  release-cli:
    needs: release-please
    if: ${{ needs.release-please.outputs.cli--release_created == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
          workdir: cli
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      - name: Get version from tag
        id: version
        run: |
          TAG="${{ needs.release-please.outputs.cli--tag_name }}"
          VERSION="${TAG#cli-v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Copy binaries to npm packages
        run: |
          # Copy binaries from goreleaser binary archive output to npm package dirs
          cp cli/dist/xschema_linux_arm64 cli/npm/cli-linux-arm64/xschema
          cp cli/dist/xschema_linux_amd64_v1 cli/npm/cli-linux-x64/xschema
          cp cli/dist/xschema_darwin_arm64 cli/npm/cli-darwin-arm64/xschema
          cp cli/dist/xschema_darwin_amd64_v1 cli/npm/cli-darwin-x64/xschema
          cp cli/dist/xschema_windows_arm64.exe cli/npm/cli-win32-arm64/xschema.exe
          cp cli/dist/xschema_windows_amd64_v1.exe cli/npm/cli-win32-x64/xschema.exe

      - name: Update package versions
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          
          # Update platform package versions
          for dir in cli/npm/cli-*/; do
            jq --arg v "$VERSION" '.version = $v' "$dir/package.json" > tmp.json
            mv tmp.json "$dir/package.json"
          done
          
          # Update main package version and optionalDependencies
          jq --arg v "$VERSION" '
            .version = $v |
            .optionalDependencies = (.optionalDependencies | with_entries(.value = $v))
          ' cli/npm/cli/package.json > tmp.json
          mv tmp.json cli/npm/cli/package.json

      - name: Publish platform packages to npm
        run: |
          for pkg in cli-darwin-arm64 cli-darwin-x64 cli-linux-arm64 cli-linux-x64 cli-win32-arm64 cli-win32-x64; do
            echo "Publishing @xschemadev/$pkg..."
            cd "$pkg"
            npm publish --access public
            cd ..
          done
        working-directory: cli/npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish main CLI package to npm
        run: npm publish --access public
        working-directory: cli/npm/cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # Publish TypeScript packages when released
  release-typescript:
    needs: release-please
    if: |
      needs.release-please.outputs.core--release_created == 'true' ||
      needs.release-please.outputs.client--release_created == 'true' ||
      needs.release-please.outputs.zod--release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install
        working-directory: typescript

      - name: Build all packages
        run: bun run build
        working-directory: typescript

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Publish @xschemadev/core
        if: needs.release-please.outputs.core--release_created == 'true'
        run: npm publish --access public
        working-directory: typescript/packages/core
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @xschemadev/client
        if: needs.release-please.outputs.client--release_created == 'true'
        run: npm publish --access public
        working-directory: typescript/packages/client
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @xschemadev/zod
        if: needs.release-please.outputs.zod--release_created == 'true'
        run: npm publish --access public
        working-directory: typescript/packages/zod
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
