name: Release Please

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [master]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      cli--release_created: ${{ steps.release.outputs['cli--release_created'] }}
      cli--tag_name: ${{ steps.release.outputs['cli--tag_name'] }}
      core--release_created: ${{ steps.release.outputs['typescript--packages--core--release_created'] }}
      client--release_created: ${{ steps.release.outputs['typescript--packages--client--release_created'] }}
      zod--release_created: ${{ steps.release.outputs['typescript--packages--zod--release_created'] }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Build and publish Go CLI when released
  release-cli:
    needs: release-please
    if: ${{ needs.release-please.outputs.cli--release_created == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version from tag
        id: version
        run: |
          TAG="${{ needs.release-please.outputs.cli--tag_name }}"
          VERSION="${TAG#cli-v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Build binaries for all platforms
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          COMMIT="${GITHUB_SHA::7}"
          DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          LDFLAGS="-s -w -X github.com/xschemadev/xschema/cmd.version=$VERSION -X github.com/xschemadev/xschema/cmd.commit=$COMMIT -X github.com/xschemadev/xschema/cmd.date=$DATE"
          
          mkdir -p dist
          
          echo "Building linux/amd64..."
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags "$LDFLAGS" -o dist/xschema-linux-x64/xschema .
          
          echo "Building linux/arm64..."
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags "$LDFLAGS" -o dist/xschema-linux-arm64/xschema .
          
          echo "Building darwin/amd64..."
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -ldflags "$LDFLAGS" -o dist/xschema-darwin-x64/xschema .
          
          echo "Building darwin/arm64..."
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -ldflags "$LDFLAGS" -o dist/xschema-darwin-arm64/xschema .
          
          echo "Building windows/amd64..."
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -ldflags "$LDFLAGS" -o dist/xschema-win32-x64/xschema.exe .
          
          echo "Building windows/arm64..."
          CGO_ENABLED=0 GOOS=windows GOARCH=arm64 go build -ldflags "$LDFLAGS" -o dist/xschema-win32-arm64/xschema.exe .
        working-directory: cli

      - name: Create archives and upload to GitHub release
        run: |
          cd dist
          for dir in */; do
            name="${dir%/}"
            tar -czf "${name}.tar.gz" -C "$dir" .
          done
          gh release upload ${{ needs.release-please.outputs.cli--tag_name }} *.tar.gz --clobber
        working-directory: cli
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Copy binaries to npm packages
        run: |
          cp dist/xschema-linux-x64/xschema     npm/cli-linux-x64/xschema
          cp dist/xschema-linux-arm64/xschema   npm/cli-linux-arm64/xschema
          cp dist/xschema-darwin-x64/xschema    npm/cli-darwin-x64/xschema
          cp dist/xschema-darwin-arm64/xschema  npm/cli-darwin-arm64/xschema
          cp dist/xschema-win32-x64/xschema.exe npm/cli-win32-x64/xschema.exe
          cp dist/xschema-win32-arm64/xschema.exe npm/cli-win32-arm64/xschema.exe
        working-directory: cli

      - name: Publish platform packages to npm
        run: |
          for pkg in cli-darwin-arm64 cli-darwin-x64 cli-linux-arm64 cli-linux-x64 cli-win32-arm64 cli-win32-x64; do
            echo "Publishing @xschemadev/$pkg..."
            cd "$pkg"
            npm publish --access public
            cd ..
          done
        working-directory: cli/npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish main CLI package to npm
        run: npm publish --access public
        working-directory: cli/npm/cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # Publish TypeScript packages when released
  release-typescript:
    needs: release-please
    if: |
      needs.release-please.outputs.core--release_created == 'true' ||
      needs.release-please.outputs.client--release_created == 'true' ||
      needs.release-please.outputs.zod--release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install
        working-directory: typescript

      - name: Build all packages
        run: bun run build
        working-directory: typescript

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Publish @xschemadev/core
        if: needs.release-please.outputs.core--release_created == 'true'
        run: npm publish --access public
        working-directory: typescript/packages/core
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @xschemadev/client
        if: needs.release-please.outputs.client--release_created == 'true'
        run: npm publish --access public
        working-directory: typescript/packages/client
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @xschemadev/zod
        if: needs.release-please.outputs.zod--release_created == 'true'
        run: npm publish --access public
        working-directory: typescript/packages/zod
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
