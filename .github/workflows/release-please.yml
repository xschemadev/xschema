name: Release Please

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [master]

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      cli--release_created: ${{ steps.release.outputs['cli--release_created'] }}
      cli--tag_name: ${{ steps.release.outputs['cli--tag_name'] }}
      ts-core--release_created: ${{ steps.release.outputs['typescript/packages/core--release_created'] }}
      ts-client--release_created: ${{ steps.release.outputs['typescript/packages/client--release_created'] }}
      ts-zod--release_created: ${{ steps.release.outputs['typescript/packages/adapters/zod--release_created'] }}
      ts-arktype--release_created: ${{ steps.release.outputs['typescript/packages/adapters/arktype--release_created'] }}
      ts-effect--release_created: ${{ steps.release.outputs['typescript/packages/adapters/effect--release_created'] }}
      ts-typebox--release_created: ${{ steps.release.outputs['typescript/packages/adapters/typebox--release_created'] }}
      ts-valibot--release_created: ${{ steps.release.outputs['typescript/packages/adapters/valibot--release_created'] }}
      ts-typescript--release_created: ${{ steps.release.outputs['typescript/packages/adapters/typescript--release_created'] }}
      py-core--release_created: ${{ steps.release.outputs['python/packages/core--release_created'] }}
      py-client--release_created: ${{ steps.release.outputs['python/packages/client--release_created'] }}
      py-pydantic--release_created: ${{ steps.release.outputs['python/packages/adapters/pydantic--release_created'] }}
    steps:
      # Using PAT instead of GITHUB_TOKEN so PRs trigger workflow runs
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Trigger CI for release-please PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          prs=$(gh pr list --repo ${{ github.repository }} --state open --json headRefName --jq '.[] | select(.headRefName | startswith("release-please--")) | .headRefName')

          for branch in $prs; do
            echo "Dispatching CI for branch: $branch"
            gh workflow run CI --repo ${{ github.repository }} --ref "$branch"
            
            echo "Dispatching Compliance Check for branch: $branch"
            gh workflow run "Compliance Check" --repo ${{ github.repository }} --ref "$branch"
          done

  # Build and publish Go CLI when released
  release-cli:
    needs: release-please
    if: ${{ needs.release-please.outputs.cli--release_created == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version from tag
        id: version
        run: |
          TAG="${{ needs.release-please.outputs.cli--tag_name }}"
          VERSION="${TAG#cli-v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Build binaries for all platforms
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          COMMIT="${GITHUB_SHA::7}"
          DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          LDFLAGS="-s -w -X github.com/xschemadev/xschema/cmd.version=$VERSION -X github.com/xschemadev/xschema/cmd.commit=$COMMIT -X github.com/xschemadev/xschema/cmd.date=$DATE"

          mkdir -p dist

          echo "Building linux/amd64..."
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags "$LDFLAGS" -o dist/xschema-linux-x64/xschema .

          echo "Building linux/arm64..."
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags "$LDFLAGS" -o dist/xschema-linux-arm64/xschema .

          echo "Building darwin/amd64..."
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -ldflags "$LDFLAGS" -o dist/xschema-darwin-x64/xschema .

          echo "Building darwin/arm64..."
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -ldflags "$LDFLAGS" -o dist/xschema-darwin-arm64/xschema .

          echo "Building windows/amd64..."
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -ldflags "$LDFLAGS" -o dist/xschema-win32-x64/xschema.exe .

          echo "Building windows/arm64..."
          CGO_ENABLED=0 GOOS=windows GOARCH=arm64 go build -ldflags "$LDFLAGS" -o dist/xschema-win32-arm64/xschema.exe .
        working-directory: cli

      - name: Create archives and upload to GitHub release
        run: |
          cd dist
          for dir in */; do
            name="${dir%/}"
            tar -czf "${name}.tar.gz" -C "$dir" .
          done
          gh release upload ${{ needs.release-please.outputs.cli--tag_name }} *.tar.gz --clobber
        working-directory: cli
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Copy binaries to npm packages
        run: |
          cp dist/xschema-linux-x64/xschema     release/npm/cli-linux-x64/xschema
          cp dist/xschema-linux-arm64/xschema   release/npm/cli-linux-arm64/xschema
          cp dist/xschema-darwin-x64/xschema    release/npm/cli-darwin-x64/xschema
          cp dist/xschema-darwin-arm64/xschema  release/npm/cli-darwin-arm64/xschema
          cp dist/xschema-win32-x64/xschema.exe release/npm/cli-win32-x64/xschema.exe
          cp dist/xschema-win32-arm64/xschema.exe release/npm/cli-win32-arm64/xschema.exe
        working-directory: cli

      - name: Publish platform packages to npm
        run: |
          for pkg in cli-darwin-arm64 cli-darwin-x64 cli-linux-arm64 cli-linux-x64 cli-win32-arm64 cli-win32-x64; do
            echo "Publishing @xschemadev/$pkg..."
            cd "$pkg"
            npm publish --access public
            cd ..
          done
        working-directory: cli/release/npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish main CLI package to npm
        run: npm publish --access public
        working-directory: cli/release/npm/cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Publish PyPI CLI packages
      - uses: astral-sh/setup-uv@v4

      - name: Copy binaries to PyPI packages
        run: |
          cp dist/xschema-linux-x64/xschema     release/pypi/xschema-cli-linux-x64/src/xschema_cli_linux_x64/xschema
          cp dist/xschema-linux-arm64/xschema   release/pypi/xschema-cli-linux-arm64/src/xschema_cli_linux_arm64/xschema
          cp dist/xschema-darwin-x64/xschema    release/pypi/xschema-cli-darwin-x64/src/xschema_cli_darwin_x64/xschema
          cp dist/xschema-darwin-arm64/xschema  release/pypi/xschema-cli-darwin-arm64/src/xschema_cli_darwin_arm64/xschema
          cp dist/xschema-win32-x64/xschema.exe release/pypi/xschema-cli-win32-x64/src/xschema_cli_win32_x64/xschema.exe
          cp dist/xschema-win32-arm64/xschema.exe release/pypi/xschema-cli-win32-arm64/src/xschema_cli_win32_arm64/xschema.exe
        working-directory: cli

      - name: Publish platform packages to PyPI
        run: |
          for pkg in xschema-cli-darwin-arm64 xschema-cli-darwin-x64 xschema-cli-linux-arm64 xschema-cli-linux-x64 xschema-cli-win32-arm64 xschema-cli-win32-x64; do
            echo "Publishing $pkg..."
            cd "$pkg"
            uv build
            uv publish --token ${{ secrets.PYPI_TOKEN }}
            cd ..
          done
        working-directory: cli/release/pypi

      - name: Publish main xschema-cli package to PyPI
        run: |
          uv build
          uv publish --token ${{ secrets.PYPI_TOKEN }}
        working-directory: cli/release/pypi/xschema-cli

  # Publish TypeScript packages when released
  release-ts:
    needs: release-please
    if: |
      needs.release-please.outputs.ts-core--release_created == 'true' ||
      needs.release-please.outputs.ts-client--release_created == 'true' ||
      needs.release-please.outputs.ts-zod--release_created == 'true' ||
      needs.release-please.outputs.ts-arktype--release_created == 'true' ||
      needs.release-please.outputs.ts-effect--release_created == 'true' ||
      needs.release-please.outputs.ts-typebox--release_created == 'true' ||
      needs.release-please.outputs.ts-valibot--release_created == 'true' ||
      needs.release-please.outputs.ts-typescript--release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install
        working-directory: typescript

      - name: Build all packages
        run: bun run build
        working-directory: typescript

      - name: Publish @xschemadev/core
        if: needs.release-please.outputs.ts-core--release_created == 'true'
        run: bun publish --access public
        working-directory: typescript/packages/core
        env:
          NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @xschemadev/client
        if: needs.release-please.outputs.ts-client--release_created == 'true'
        run: bun publish --access public
        working-directory: typescript/packages/client
        env:
          NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @xschemadev/zod
        if: needs.release-please.outputs.ts-zod--release_created == 'true'
        run: bun publish --access public
        working-directory: typescript/packages/adapters/zod
        env:
          NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @xschemadev/arktype
        if: needs.release-please.outputs.ts-arktype--release_created == 'true'
        run: bun publish --access public
        working-directory: typescript/packages/adapters/arktype
        env:
          NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @xschemadev/effect
        if: needs.release-please.outputs.ts-effect--release_created == 'true'
        run: bun publish --access public
        working-directory: typescript/packages/adapters/effect
        env:
          NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @xschemadev/typebox
        if: needs.release-please.outputs.ts-typebox--release_created == 'true'
        run: bun publish --access public
        working-directory: typescript/packages/adapters/typebox
        env:
          NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @xschemadev/valibot
        if: needs.release-please.outputs.ts-valibot--release_created == 'true'
        run: bun publish --access public
        working-directory: typescript/packages/adapters/valibot
        env:
          NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}

  # Publish Python packages to PyPI when released
  # NOTE: Requires PYPI_TOKEN secret to be configured in GitHub repo settings
  release-py:
    needs: release-please
    if: |
      needs.release-please.outputs.py-core--release_created == 'true' ||
      needs.release-please.outputs.py-client--release_created == 'true' ||
      needs.release-please.outputs.py-pydantic--release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v4

      - name: Publish xschema-core
        if: needs.release-please.outputs.py-core--release_created == 'true'
        run: |
          uv build
          uv publish --token ${{ secrets.PYPI_TOKEN }}
        working-directory: python/packages/core

      - name: Publish xschema-client
        if: needs.release-please.outputs.py-client--release_created == 'true'
        run: |
          uv build
          uv publish --token ${{ secrets.PYPI_TOKEN }}
        working-directory: python/packages/client

      - name: Publish xschema-pydantic
        if: needs.release-please.outputs.py-pydantic--release_created == 'true'
        run: |
          uv build
          uv publish --token ${{ secrets.PYPI_TOKEN }}
        working-directory: python/packages/adapters/pydantic
