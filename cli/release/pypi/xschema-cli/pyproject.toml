[project]
name = "xschema-cli"
version = "0.3.0"
description = "XSchema CLI - Bring your JSON Schemas to life"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
keywords = ["json-schema", "codegen", "zod", "pydantic", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Code Generators",
]

[project.urls]
Homepage = "https://xschema.dev"
Documentation = "https://xschema.dev/docs"
Repository = "https://github.com/xschemadev/xschema"
Issues = "https://github.com/xschemadev/xschema/issues"

[project.scripts]
xschema = "xschema_cli:main"

# Optional dependencies for platform-specific binaries
# Note: These versions must be updated manually when releasing (or via script)
[project.optional-dependencies]
darwin-arm64 = ["xschema-cli-darwin-arm64==0.2.1"]
darwin-x64 = ["xschema-cli-darwin-x64==0.2.1"]
linux-arm64 = ["xschema-cli-linux-arm64==0.2.1"]
linux-x64 = ["xschema-cli-linux-x64==0.2.1"]
win32-arm64 = ["xschema-cli-win32-arm64==0.2.1"]
win32-x64 = ["xschema-cli-win32-x64==0.2.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xschema_cli"]
