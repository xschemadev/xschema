[project]
name = "xschema-pydantic"
version = "0.1.1"
description = "XSchema adapter for generating Pydantic v2 models from JSON Schema"
requires-python = ">=3.10"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "xschemadev" }]
maintainers = [{ name = "xschemadev" }]
keywords = [
    "json-schema",
    "validation",
    "pydantic",
    "code-generation",
    "schema",
    "type-safety",
    "adapter",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.0",
    "xschema-core",
]

[project.urls]
Homepage = "https://xschema.dev"
Documentation = "https://xschema.dev"
Repository = "https://github.com/xschemadev/xschema"
Issues = "https://github.com/xschemadev/xschema/issues"
Changelog = "https://github.com/xschemadev/xschema/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xschema_pydantic"]

[project.scripts]
xschema-pydantic = "xschema_pydantic.__main__:main"

[tool.uv.sources]
xschema-core = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "pytest>=8.0",
]
