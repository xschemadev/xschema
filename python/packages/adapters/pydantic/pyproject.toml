[project]
name = "xschema-pydantic"
version = "0.1.0"
description = "XSchema adapter for generating Pydantic v2 models from JSON Schema"
requires-python = ">=3.10"
readme = "README.md"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.0",
    "xschema-core",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xschema_pydantic"]

[project.scripts]
xschema-pydantic = "xschema_pydantic.__main__:main"

[tool.uv.sources]
xschema-core = { path = "../../core", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "pytest>=8.0",
]
